
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p macintosh_wallpaper

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/macintosh_wallpaper.exe dist/
          Copy-Item target/release/macintosh_wallpaper.exe dist/macintosh_screensaver.scr

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Macintosh-Windows
          path: dist/*
          if-no-files-found: error
